apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nakama
  namespace: nakama
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: nakama.orviagame.com.tr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nakama
                port:
                  number: 7350
