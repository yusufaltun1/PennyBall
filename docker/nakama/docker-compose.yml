version: "3"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
    volumes:
      - nakama-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "local", "-d", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.22.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address local:local@postgres:5432/nakama &&
        exec /nakama/nakama
        --name nakama1
        --database.address local:local@postgres:5432/nakama
        --logger.level DEBUG
        --session.token_expiry_sec 7200
        --runtime.path /nakama/data/modules
        --runtime.http_key "defaulthttpkey"
        --socket.server_key "defaultkey"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../Server/nakama/data:/nakama/data
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"

volumes:
  nakama-postgres:
